[package]
name = "ro-git-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yew WASM frontend for ro-git"

[lib]
name = "ro_git_ui"
path = "src/lib.rs"

[[bin]]
name = "ro-git-ui"
path = "src/main.rs"

[dependencies]
ro-git-proto.workspace = true
roto.workspace = true
roto-runtime.workspace = true
yew = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
gloo-timers.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "Headers",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Location",
    "Navigator",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Window",
] }
