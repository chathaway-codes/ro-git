[package]
name = "ro-git-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yew WASM frontend for ro-git"

[[bin]]
name = "ro-git-ui"
path = "src/main.rs"

[dependencies]
ro-git-proto.workspace = true
roto.workspace = true
roto-runtime.workspace = true
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "Storage"] }
