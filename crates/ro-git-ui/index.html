<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ro-git — Repository Index</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="ro-git-ui" />
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --panel: #161b22;
        --panel-alt: #0f141b;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-hover: #79c0ff;
        --success: #3fb950;
        --warning: #d29922;
        --danger: #f85149;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.5;
      }

      code, pre {
        font-family: var(--mono);
      }

      .ro-git-app {
        max-width: 1080px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }

      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 1.25rem;
        margin-bottom: 1.25rem;
        border-bottom: 1px solid var(--border);
      }

      .brand-title-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .brand-title {
        margin: 0;
        font-family: var(--mono);
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .host-pill {
        font-family: var(--mono);
        font-size: 0.78rem;
        padding: 0.15rem 0.55rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
      }

      .brand-subtitle {
        margin: 0.25rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .auth-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
      }

      .auth-status-badge {
        font-family: var(--mono);
        font-size: 0.8rem;
        padding: 0.3rem 0.65rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
      }

      .auth-authenticated {
        border-color: rgba(63, 185, 80, 0.5);
        color: var(--success);
      }

      .auth-anonymous {
        color: var(--muted);
      }

      .btn {
        font-family: var(--sans);
        font-size: 0.84rem;
        font-weight: 500;
        padding: 0.42rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        transition: border-color 0.12s ease, background 0.12s ease;
      }

      .btn:hover:not(:disabled) {
        border-color: var(--muted);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .btn-primary {
        background: #1f6feb;
        border-color: #388bfd;
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #388bfd;
      }

      .btn-danger {
        color: var(--danger);
        border-color: rgba(248, 81, 73, 0.45);
      }

      .btn-copy {
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .btn-copied {
        border-color: var(--success) !important;
        color: var(--success) !important;
      }

      .btn-sm {
        padding: 0.22rem 0.55rem;
        font-size: 0.75rem;
      }

      .btn-link {
        background: transparent;
        border: none;
        color: var(--accent);
        padding: 0.15rem 0.35rem;
      }

      .btn-icon {
        font-size: 1.15rem;
        line-height: 1;
        padding: 0.2rem 0.55rem;
      }

      .filter-bar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.9rem 1rem;
        margin-bottom: 1.25rem;
      }

      .filter-controls {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 0.75rem;
      }

      @media (max-width: 780px) {
        .filter-controls {
          grid-template-columns: 1fr;
        }
      }

      .filter-field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .filter-field label {
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .filter-field input,
      .filter-field select,
      .filter-field textarea {
        background: var(--panel-alt);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.45rem 0.65rem;
        font-size: 0.88rem;
        font-family: var(--sans);
      }

      .filter-field textarea {
        font-family: var(--mono);
        font-size: 0.8rem;
        resize: vertical;
      }

      .filter-summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.7rem;
        padding-top: 0.55rem;
        border-top: 1px solid var(--border);
        font-size: 0.82rem;
        color: var(--muted);
      }

      .repo-group {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        overflow: hidden;
      }

      .repo-group-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.65rem 1rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .repo-group-title {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .group-path {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.96rem;
      }

      .group-count {
        font-size: 0.78rem;
        color: var(--muted);
      }

      .repo-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem;
        padding: 0.85rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      .repo-card:last-child {
        border-bottom: none;
      }

      .repo-title-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.2rem;
      }

      .repo-name {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 0.96rem;
        color: var(--accent);
      }

      .badge {
        font-family: var(--mono);
        font-size: 0.7rem;
        padding: 0.08rem 0.45rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        text-transform: lowercase;
      }

      .badge-scope-user {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.4);
      }

      .badge-scope-team {
        color: #d2a8ff;
        border-color: rgba(210, 168, 255, 0.4);
      }

      .badge-vis-public {
        color: var(--success);
        border-color: rgba(63, 185, 80, 0.4);
      }

      .badge-vis-private {
        color: var(--warning);
        border-color: rgba(210, 153, 34, 0.45);
      }

      .repo-canonical-path code {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .repo-command-preview {
        margin-top: 0.25rem;
      }

      .repo-command-preview code {
        font-size: 0.78rem;
        color: var(--text);
        background: var(--panel-alt);
        padding: 0.15rem 0.45rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        word-break: break-all;
      }

      .repo-card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .empty-state {
        text-align: center;
        padding: 2.5rem 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--muted);
      }

      .empty-hint {
        font-size: 0.85rem;
        margin-top: 0.35rem;
      }

      .alert {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.65rem 0.9rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }

      .alert-error {
        background: rgba(248, 81, 73, 0.12);
        border: 1px solid rgba(248, 81, 73, 0.45);
        color: #ffa198;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(1, 4, 9, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 100;
      }

      .modal-panel {
        width: 100%;
        max-width: 640px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.1rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .modal-header h2 {
        margin: 0;
        font-size: 1rem;
        font-family: var(--mono);
      }

      .modal-body {
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .modal-intro {
        margin: 0;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      @media (max-width: 560px) {
        .modal-grid {
          grid-template-columns: 1fr;
        }
      }

      .label-with-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .command-box {
        margin: 0;
        padding: 0.65rem 0.75rem;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.78rem;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--border);
      }

      .markdown-body {
        color: var(--text);
        line-height: 1.6;
        word-wrap: break-word;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin-top: 1.25rem;
        margin-bottom: 0.65rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .markdown-body h1,
      .markdown-body h2 {
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--border);
      }

      .markdown-body a {
        color: var(--accent);
        text-decoration: none;
      }

      .markdown-body a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .markdown-body code {
        padding: 0.15rem 0.35rem;
        font-size: 0.85em;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .markdown-body pre {
        padding: 0.85rem 1rem;
        overflow-x: auto;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .markdown-body pre code {
        padding: 0;
        background: transparent;
        border: none;
      }

      .markdown-body blockquote {
        margin: 0 0 1rem;
        padding: 0.25rem 1rem;
        color: var(--muted);
        border-left: 0.25rem solid var(--border);
      }

      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1rem;
      }

      .markdown-body th,
      .markdown-body td {
        padding: 0.45rem 0.75rem;
        border: 1px solid var(--border);
      }

      .markdown-body th {
        background: var(--panel-alt);
        font-weight: 600;
      }

      .markdown-body hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 1.25rem 0;
      }

      .markdown-body img {
        max-width: 100%;
      }

      .markdown-body li.task-list-item {
        list-style-type: none;
      }

      .brand-link {
        color: var(--text);
        text-decoration: none;
      }

      .brand-link:hover {
        color: var(--accent);
      }

      .repo-name-link,
      .repo-canonical-link {
        text-decoration: none;
      }

      .repo-name-link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .repo-canonical-link:hover code {
        color: var(--accent);
      }

      /* Repository Browser Header & Navigation */
      .repo-browser-header {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.1rem 0;
        margin-bottom: 1.25rem;
      }

      .repo-breadcrumb-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--mono);
        font-size: 0.96rem;
        margin-bottom: 0.65rem;
      }

      .repo-index-back-link,
      .repo-coord-name {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .repo-index-back-link:hover,
      .repo-coord-name:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .repo-coord-seg {
        color: var(--muted);
      }

      .breadcrumb-sep {
        color: var(--muted);
        user-select: none;
      }

      .repo-clone-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.85rem;
      }

      .repo-clone-snippet {
        font-size: 0.78rem;
        color: var(--text);
        background: var(--panel-alt);
        padding: 0.25rem 0.55rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        word-break: break-all;
      }

      .repo-nav-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding-top: 0.55rem;
        border-top: 1px solid var(--border);
      }

      .ref-switcher {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        padding-bottom: 0.55rem;
      }

      .ref-switcher-label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
      }

      .ref-select {
        background: var(--panel-alt);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.32rem 0.6rem;
        font-family: var(--mono);
        font-size: 0.82rem;
      }

      .repo-tabs {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      .repo-tab {
        display: inline-block;
        padding: 0.5rem 0.9rem;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 2px solid transparent;
      }

      .repo-tab:hover {
        color: var(--text);
      }

      .repo-tab-active {
        color: var(--text);
        font-weight: 600;
        border-bottom-color: var(--accent);
      }

      /* Path Breadcrumbs */
      .path-breadcrumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        font-family: var(--mono);
        font-size: 0.88rem;
        padding: 0.55rem 0.85rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 0.85rem;
      }

      .breadcrumb-link {
        color: var(--accent);
        text-decoration: none;
      }

      .breadcrumb-link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .breadcrumb-current {
        color: var(--text);
        font-weight: 600;
      }

      /* Directory Tree Table & Empty Repo State */
      .empty-repo-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2rem 1.25rem;
        text-align: center;
      }

      .empty-repo-panel h3 {
        margin-top: 0;
        margin-bottom: 0.35rem;
      }

      .tree-table-wrapper {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow-x: auto;
        margin-bottom: 1.25rem;
      }

      .tree-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.86rem;
      }

      .tree-table th,
      .tree-table td {
        padding: 0.5rem 0.85rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      .tree-table thead th {
        background: var(--panel-alt);
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .tree-table tbody tr:last-child td {
        border-bottom: none;
      }

      .tree-table tbody tr:hover {
        background: rgba(88, 166, 255, 0.04);
      }

      .tree-col-kind {
        width: 5.5rem;
      }

      .tree-col-mode,
      .tree-col-oid,
      .tree-col-size {
        width: 6.5rem;
        font-family: var(--mono);
        color: var(--muted);
        white-space: nowrap;
      }

      .tree-col-size {
        text-align: right !important;
      }

      .tree-kind-badge {
        display: inline-block;
        font-family: var(--mono);
        font-size: 0.7rem;
        padding: 0.06rem 0.42rem;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      .tree-kind-dir {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.4);
      }

      .tree-kind-file {
        color: var(--muted);
      }

      .tree-kind-symlink,
      .tree-kind-submodule {
        color: #d2a8ff;
        border-color: rgba(210, 168, 255, 0.4);
      }

      .tree-entry-link {
        font-family: var(--mono);
        color: var(--text);
        text-decoration: none;
      }

      .tree-entry-dir {
        color: var(--accent);
        font-weight: 600;
      }

      .tree-entry-link:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }

      .tree-empty-cell {
        text-align: center !important;
        color: var(--muted);
        padding: 1.5rem !important;
      }

      /* Automatic README Panel */
      .readme-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 1.25rem;
      }

      .readme-panel-header {
        padding: 0.6rem 1rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
        font-family: var(--mono);
        font-size: 0.85rem;
        font-weight: 600;
      }

      .readme-panel-body {
        padding: 1.25rem;
      }

      /* Blob Viewer */
      .blob-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }

      .blob-panel-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .blob-meta-info {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .blob-mode-toggle,
      .clone-protocol-toggle {
        display: inline-flex;
        gap: 0.25rem;
      }

      .toggle-btn-active {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(88, 166, 255, 0.12);
      }

      .blob-truncated-banner {
        padding: 0.5rem 1rem;
        background: rgba(210, 153, 34, 0.14);
        border-bottom: 1px solid rgba(210, 153, 34, 0.45);
        color: var(--warning);
        font-size: 0.82rem;
      }

      .blob-binary-notice {
        padding: 2rem 1rem;
        text-align: center;
        color: var(--muted);
      }

      .blob-markdown-view {
        padding: 1.25rem;
      }

      .blob-code-wrapper {
        overflow-x: auto;
      }

      .blob-code-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .code-line-num {
        width: 3.5rem;
        padding: 0.08rem 0.75rem;
        text-align: right;
        color: var(--muted);
        background: var(--panel-alt);
        border-right: 1px solid var(--border);
        user-select: none;
      }

      .code-line-text {
        padding: 0.08rem 0.85rem;
        white-space: pre;
      }

      /* Commit Log & Pagination */
      .commits-header-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }

      .commits-title-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
      }

      .commits-heading {
        margin: 0;
        font-size: 1.05rem;
        font-family: var(--mono);
      }

      .commits-range-label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .commit-log-list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 1rem;
      }

      .commit-log-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      .commit-log-row:last-child {
        border-bottom: none;
      }

      .commit-subject-link {
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 0.2rem;
      }

      .commit-subject-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .commit-meta-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .commit-oid-badge {
        display: inline-block;
        font-family: var(--mono);
        font-size: 0.78rem;
        padding: 0.2rem 0.55rem;
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--accent);
        text-decoration: none;
      }

      .commit-oid-badge:hover {
        border-color: var(--accent);
      }

      .pagination-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
      }

      /* Commit Detail & Unified Diff Cards */
      .commit-detail-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        overflow: hidden;
      }

      .commit-detail-header {
        padding: 0.9rem 1rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .commit-detail-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .commit-detail-subject {
        margin: 0;
        font-size: 1.05rem;
      }

      .commit-detail-body {
        margin: 0.65rem 0 0;
        font-size: 0.82rem;
        color: var(--muted);
        white-space: pre-wrap;
      }

      .commit-detail-meta-grid {
        padding: 0.85rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-size: 0.83rem;
      }

      .commit-meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .commit-meta-label {
        width: 5.5rem;
        font-weight: 600;
        color: var(--muted);
      }

      .commit-parents-list {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .diff-summary-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.6rem 0.9rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 0.85rem;
        font-size: 0.85rem;
      }

      .diff-stat-pills {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .diff-stat-add {
        color: var(--success);
      }

      .diff-stat-del {
        color: var(--danger);
      }

      .diff-file-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        overflow: hidden;
      }

      .diff-file-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
        padding: 0.55rem 0.9rem;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
      }

      .diff-file-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .diff-file-path-link {
        color: var(--accent);
        text-decoration: none;
      }

      .diff-file-path-link:hover {
        text-decoration: underline;
      }

      .diff-status-added {
        color: var(--success);
        border-color: rgba(63, 185, 80, 0.45);
      }

      .diff-status-deleted {
        color: var(--danger);
        border-color: rgba(248, 81, 73, 0.45);
      }

      .diff-status-modified {
        color: var(--accent);
        border-color: rgba(88, 166, 255, 0.4);
      }

      .diff-status-renamed,
      .diff-status-copied,
      .diff-status-typechange {
        color: var(--warning);
        border-color: rgba(210, 153, 34, 0.45);
      }

      .diff-patch-wrapper {
        overflow-x: auto;
      }

      .diff-patch-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 0.8rem;
        line-height: 1.4;
      }

      .diff-line-num {
        width: 3.25rem;
        padding: 0.06rem 0.65rem;
        text-align: right;
        color: var(--muted);
        border-right: 1px solid var(--border);
        user-select: none;
      }

      .diff-line-code {
        padding: 0.06rem 0.75rem;
        white-space: pre;
      }

      .diff-line-add {
        background: rgba(63, 185, 80, 0.14);
        color: #7ee787;
      }

      .diff-line-del {
        background: rgba(248, 81, 73, 0.14);
        color: #ffa198;
      }

      .diff-line-hunk {
        background: rgba(88, 166, 255, 0.12);
        color: var(--accent);
      }

      .diff-line-header {
        color: var(--muted);
        background: var(--panel-alt);
      }

      .diff-empty-patch {
        padding: 1rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
    </style>
  </head>

</html>
