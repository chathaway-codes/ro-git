[workspace]
resolver = "2"
members = [
    "crates/ro-git-proto",
    "crates/ro-git-server",
    "crates/ro-git-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
roto = { git = "https://github.com/chathaway-codes/roto", default-features = false }
roto-runtime = { git = "https://github.com/chathaway-codes/roto", default-features = false }
roto-grpc = { git = "https://github.com/chathaway-codes/roto", default-features = false }
google-protobuf-roto = { git = "https://github.com/chathaway-codes/roto", default-features = false }
grpc-reflection-roto = { git = "https://github.com/chathaway-codes/roto", default-features = false }
ro-git-proto = { path = "crates/ro-git-proto", default-features = false }
libc = { version = "0.2", default-features = false }
ssh-key = { version = "0.6.7", default-features = false }
yew = { version = "0.21", default-features = false }
wasm-bindgen = { version = "=0.2.128", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
js-sys = { version = "0.3", default-features = false }
web-sys = { version = "0.3", default-features = false }
gloo-timers = { version = "0.3", default-features = false }
